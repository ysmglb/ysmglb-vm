# Meson 交叉编译文件 — 用于在 Linux/WSL 上给 Android arm64 编译 QEMU 依赖库
# (glib / pixman / libslirp / libdrm / libepoxy / virglrenderer)
#
# 用法示例:
#   meson setup build-pixman pixman-src \
#       --cross-file=../cross/android-arm64.ini \
#       --prefix=$PREFIX --default-library=static
#
# 环境变量需先在脚本中导出 (见 build-deps.sh):
#   PATH=<ndk>/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
#   PKG_CONFIG_SYSROOT_DIR=<ndk>/toolchains/llvm/prebuilt/linux-x86_64/sysroot
#   PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig

[binaries]
c = 'aarch64-linux-android26-clang'
cpp = 'aarch64-linux-android26-clang++'
ar = 'llvm-ar'
nm = 'llvm-nm'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[built-in options]
c_args = ['-D__ANDROID_API__=26', '-O2']
cpp_args = ['-D__ANDROID_API__=26', '-O2']
c_link_args = ['-llog', '-lm']
cpp_link_args = ['-llog', '-lm']

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
