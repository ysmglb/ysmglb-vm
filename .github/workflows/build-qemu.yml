name: build-qemu

# 在 GitHub 云端交叉编译 QEMU → libqemu.so (Android arm64)
# 手动触发: Actions 页面 → build-qemu → Run workflow
# 产物: 该次运行的 Artifacts 里下载 libqemu-arm64-v8a.zip

on:
  workflow_dispatch:
    inputs:
      qemu_version:
        description: "QEMU 版本"
        required: false
        default: "9.1.0"
  push:
    paths:
      - "build/build-deps.sh"
      - "build/build-qemu.sh"
      - "build/cross/android-arm64.ini"
      - ".github/workflows/build-qemu.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: write  # 允许 bot push 日志到 ci-failure-latest branch

    env:
      NDK_VERSION: "26.3.11579264"
      API: "28"
      QEMU_VER: ${{ github.event.inputs.qemu_version || '9.1.0' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装基础构建工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config unzip xz-utils bzip2 autoconf automake libtool \
            python3-pip ninja-build cmake
          python3 -m pip install --upgrade "meson>=1.2" ninja

      - name: 安装 Android NDK ${{ env.NDK_VERSION }}
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"
          echo "NDK=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 缓存依赖编译结果
        uses: actions/cache@v4
        with:
          path: |
            build/_prefix
            build/_work
          key: deps-${{ runner.os }}-${{ env.API }}-${{ hashFiles('build/build-deps.sh', 'build/cross/android-arm64.ini') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ env.API }}-

      - name: 编译依赖库 (glib/pixman/libslirp/libdrm/libepoxy/virglrenderer)
        env:
          NDK: ${{ env.NDK }}
        run: |
          set -o pipefail
          chmod +x build/build-deps.sh
          bash build/build-deps.sh 2>&1 | stdbuf -oL tee deps.log

      - name: DEP 进度标记
        if: always()
        run: |
          echo "=== MARKERS ==="
          if [ -f deps.log ]; then
            grep -E "==DEP==|ERROR|FAILED|error:|ninja:|meson setup" deps.log | tail -40 || true
          fi

      - name: 编译 QEMU
        env:
          NDK: ${{ env.NDK }}
        run: |
          set -o pipefail
          chmod +x build/build-qemu.sh
          bash build/build-qemu.sh 2>&1 | tee qemu.log
          ls -lh app/src/main/jniLibs/arm64-v8a/libqemu.so

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: libqemu-arm64-v8a
          path: app/src/main/jniLibs/arm64-v8a/libqemu.so
          if-no-files-found: error

      - name: 成功时把 libqemu.so 发布到 ci-artifact 分支
        # artifact 下载需要认证 token, 推到分支后本地可直接 raw 下载
        if: success()
        run: |
          cp app/src/main/jniLibs/arm64-v8a/libqemu.so "$RUNNER_TEMP/libqemu.so"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-artifact
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/libqemu.so" libqemu.so
          printf 'HEAD_SHA=%s\nRUN_URL=%s/%s/actions/runs/%s\nSIZE=%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$(stat -c%s libqemu.so)" > INFO.md
          git add libqemu.so INFO.md
          git commit -m "artifact: libqemu.so from ${GITHUB_SHA:0:7}"
          git push --force origin HEAD:ci-artifact

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            deps.log
            qemu.log
          if-no-files-found: ignore

      - name: 失败时保存 deps.log 到 ci-failure-latest branch
        if: failure() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-failure-latest
          git rm -rf . >/dev/null 2>&1 || true
          # deps.log 是未跟踪文件, git rm -rf 不会删它
          echo "HEAD_SHA=${GITHUB_SHA}" > FAIL.md
          echo "RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> FAIL.md
          if [ -s deps.log ]; then
            echo "===== DEPS: LAST 40 LINES =====" >> FAIL.md
            tail -40 deps.log >> FAIL.md
            echo "===== DEPS: ==DEP== MARKERS =====" >> FAIL.md
            grep "==DEP==" deps.log >> FAIL.md || true
          else
            echo "deps.log empty or missing!" >> FAIL.md
            ls -la >> FAIL.md
          fi
          if [ -s qemu.log ]; then
            echo "===== QEMU: LAST 100 LINES =====" >> FAIL.md
            tail -100 qemu.log >> FAIL.md
          fi
          git add FAIL.md deps.log qemu.log 2>/dev/null || git add FAIL.md
          git commit -m "CI failure log: $(date -u +%H:%M) from ${GITHUB_SHA:0:7}"
          git push --force origin HEAD:ci-failure-latest
